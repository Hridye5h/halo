# fly.toml — https://fly.io
#
# Region: Frankfurt. See DEPLOYMENT.md §1 — for users spread across Asia and
# the Americas, Europe balances round-trip time instead of making it good for
# one end and poor for the other.
#
#   fly launch --no-deploy --copy-config
#   fly secrets set MONGO_URI="..." JWT_ACCESS_SECRET="..." ...
#   fly deploy

app = "halo"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true

  # Sockets are long-lived: stopping the machine when idle would disconnect
  # anyone sitting in a quiet conversation.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
